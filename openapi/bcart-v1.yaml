      - 認証
      operationId: issueToken
      summary: アクセストークン発行／更新
      description: '`grant_type=authorization_code` で認可コードをアクセストークンに交換、`grant_type=refresh_token` でアクセストークンを更新する。アクセストークンの有効期限は14日。リフレッシュトークン使用時は新しいリフレッシュトークンも発行され、使用済みリフレッシュトークンと古いアクセストークンは無効になる。'
      servers:
      - url: https://app.bcart.jp
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - client_id
              - client_secret
              properties:
                grant_type:
                  type: string
                  enum:
                  - authorization_code
                  - refresh_token
                client_id:
                  type: string
                  description: アプリ登録時に発行されたクライアントID
                client_secret:
                  type: string
                  description: アプリ登録時に発行されたクライアントシークレット
                redirect_uri:
                  type: string
                  description: 'authorization_code 時: 登録したリダイレクトURI'
                code:
                  type: string
                  description: 'authorization_code 時: 認可コード'
                refresh_token:
                  type: string
                  description: 'refresh_token 時: リフレッシュトークン'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    example: 1209600
                  access_token:
                    type: string
                  refresh_token:
                    type: string
        '400':
          description: 失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
                  hint:
                    type: string
                  message:
                    type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: パーソナルアクセストークン、またはOAuth2.0で取得したアクセストークン
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.bcart.jp/oauth/authorize
          tokenUrl: https://app.bcart.jp/oauth/token
          refreshUrl: https://app.bcart.jp/oauth/token
          scopes:
            user-read: アカウント情報参照
            products-read: 商品情報参照
            products-write: 商品情報書込み
            product_customs-read: 商品カスタム情報参照
            product_customs-write: 商品カスタム情報書込み
            product_sets-read: 商品セット情報参照
            product_sets-write: 商品セット情報書込み
            product_set_options-read: 商品セットオプション情報参照
            product_set_options-write: 商品セットオプション情報書込み
            product_set_customs-read: 商品セットカスタム情報参照
            product_set_customs-write: 商品セットカスタム情報書込み
            product_stock-read: 在庫情報参照
            product_stock-write: 在庫情報書込み
            categories-read: 商品カテゴリ参照
            categories-write: 商品カテゴリ書込み
            customers-read: 会員情報参照
            customers-write: 会員情報書込み
            customer_customs-read: 会員カスタム情報参照
            customer_customs-write: 会員カスタム情報書込み
            other_addresses-read: 別配送先情報参照
            other_addresses-write: 別配送先情報書込み
            orders-read: 受注情報参照
            orders-write: 受注情報書込み
            order_customs-read: 受注カスタム情報参照
            order_customs-write: 受注カスタム情報書込み
            order_products-read: 受注商品情報参照
            order_products-write: 受注商品情報書込み
            logistics-read: 出荷情報参照
            logistics-write: 出荷情報書込み
            estimates-read: 見積情報参照
            estimate_products-read: 見積商品情報参照
            price_groups-read: 価格グループ情報参照
            view_groups-read: 表示グループ情報参照
            shipping_groups-read: 配送グループ情報参照
            bookmarks-read: お気に入り参照
            bookmarks-write: お気に入り書込み
            product_features-read: 特集参照
            product_features-write: 特集書込み
            points-read: ポイント参照
            points-write: ポイント書込み
            script_tags-read: スクリプトタグ参照
            script_tags-write: スクリプトタグ書込み
            webhooks-read: webhook参照
            webhooks-write: webhook書込み
  parameters:
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
      description: 取得件数。指定なしは20件、最大100件
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: 指定した値+1件目のデータから limit 分を取得。指定しない場合は0
    ids:
      name: ids
      in: query
      schema:
        type: string
      description: IDをカンマ区切りで指定。範囲や条件で指定する場合は拡張パラメータを利用
    fields:
      name: fields
      in: query
      schema:
        type: string
      description: 取得したいフィールドをカンマ区切りで指定
  schemas:
    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
    Error:
      type: object
      properties:
        error:
          type: string
  headers:
    RetryAfter:
      description: リクエスト上限超過時のみ付与。ロック解除までの時間
      schema:
        type: integer
  responses:
    Unauthorized:
      description: 認証・権限エラー（`Unauthenticated.`）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthenticated.
    ValidationError:
      description: パラメータの値が不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrors'
          example:
            errors:
            - param1:
              - param1には〇〇を指定してください。
    RateLimited:
      description: レート制限超過
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
